<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">STOA Platform Architecture</text>
  <text x="600" y="65" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Cloud-Native API Management for the AI Era</text>

  <!-- Users Section -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6d28d9" text-anchor="middle">Users</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="150" height="25" rx="4" fill="#ddd6fe"/>
      <text x="75" y="16" font-family="Inter, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">🧑‍💻 Developers</text>
    </g>
    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="150" height="25" rx="4" fill="#ddd6fe"/>
      <text x="75" y="16" font-family="Inter, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">🤖 AI Agents (Claude)</text>
    </g>
  </g>

  <!-- STOA Core Section -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="200" height="180" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#047857" text-anchor="middle">STOA Core</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="170" height="45" rx="8" fill="#6ee7b7"/>
      <text x="85" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#047857" text-anchor="middle">Control Plane API</text>
      <text x="85" y="35" font-family="Inter, sans-serif" font-size="9" fill="#059669" text-anchor="middle">Python • FastAPI • Async</text>
    </g>
    <g transform="translate(15, 95)">
      <rect x="0" y="0" width="170" height="45" rx="8" fill="#6ee7b7"/>
      <text x="85" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#047857" text-anchor="middle">MCP Gateway</text>
      <text x="85" y="35" font-family="Inter, sans-serif" font-size="9" fill="#059669" text-anchor="middle">Python • FastAPI • OPA</text>
    </g>
  </g>

  <!-- API Gateway Section -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#cffafe" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0891b2" text-anchor="middle">API Gateway</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="150" height="60" rx="6" fill="#a5f3fc"/>
      <text x="75" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#0891b2" text-anchor="middle">webMethods Gateway</text>
      <text x="75" y="35" font-family="Inter, sans-serif" font-size="8" fill="#06b6d4" text-anchor="middle">Rate Limiting • Policies</text>
      <text x="75" y="48" font-family="Inter, sans-serif" font-size="8" fill="#06b6d4" text-anchor="middle">REST • GraphQL</text>
    </g>
  </g>

  <!-- Auth Section -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#fee2e2" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#be123c" text-anchor="middle">Security</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#fecaca"/>
      <text x="75" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#be123c" text-anchor="middle">Keycloak</text>
      <text x="75" y="28" font-family="Inter, sans-serif" font-size="8" fill="#e11d48" text-anchor="middle">OIDC • OAuth2 • RBAC</text>
    </g>
    <g transform="translate(15, 85)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#fecaca"/>
      <text x="75" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#be123c" text-anchor="middle">HashiCorp Vault</text>
      <text x="75" y="28" font-family="Inter, sans-serif" font-size="8" fill="#e11d48" text-anchor="middle">Secrets • API Keys • 2FA</text>
    </g>
  </g>

  <!-- Data Layer -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="180" height="170" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Data Layer</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#fde68a"/>
      <text x="75" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#b45309" text-anchor="middle">PostgreSQL</text>
      <text x="75" y="28" font-family="Inter, sans-serif" font-size="8" fill="#d97706" text-anchor="middle">Subscriptions • Tenants</text>
    </g>
    <g transform="translate(15, 85)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#fde68a"/>
      <text x="75" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#b45309" text-anchor="middle">Redis</text>
      <text x="75" y="28" font-family="Inter, sans-serif" font-size="8" fill="#d97706" text-anchor="middle">Cache • Sessions • Limits</text>
    </g>
    <g transform="translate(15, 130)">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#fde68a"/>
      <text x="75" y="18" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#b45309" text-anchor="middle">Kafka/Redpanda 🔒</text>
    </g>
  </g>

  <!-- Observability Stack -->
  <g transform="translate(280, 460)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#4338ca" text-anchor="middle">Observability</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="80" height="35" rx="6" fill="#c7d2fe"/>
      <text x="40" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#4338ca" text-anchor="middle">Prometheus</text>
      <text x="40" y="28" font-family="Inter, sans-serif" font-size="8" fill="#6366f1" text-anchor="middle">Metrics</text>
    </g>
    <g transform="translate(105, 40)">
      <rect x="0" y="0" width="80" height="35" rx="6" fill="#c7d2fe"/>
      <text x="40" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#4338ca" text-anchor="middle">Grafana</text>
      <text x="40" y="28" font-family="Inter, sans-serif" font-size="8" fill="#6366f1" text-anchor="middle">Dashboards</text>
    </g>
    <g transform="translate(15, 85)">
      <rect x="0" y="0" width="170" height="35" rx="6" fill="#c7d2fe"/>
      <text x="85" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#4338ca" text-anchor="middle">Loki + Alertmanager</text>
      <text x="85" y="28" font-family="Inter, sans-serif" font-size="8" fill="#6366f1" text-anchor="middle">Logs • Alerts</text>
    </g>
  </g>

  <!-- MCP Servers -->
  <g transform="translate(760, 100)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#fae8ff" stroke="#d946ef" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a21caf" text-anchor="middle">MCP Servers</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="150" height="60" rx="6" fill="#f5d0fe"/>
      <text x="75" y="18" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#a21caf" text-anchor="middle">Enterprise Tools</text>
      <text x="75" y="33" font-family="Inter, sans-serif" font-size="8" fill="#c026d3" text-anchor="middle">Billing • Inventory</text>
      <text x="75" y="48" font-family="Inter, sans-serif" font-size="8" fill="#c026d3" text-anchor="middle">CRM • Analytics</text>
    </g>
  </g>

  <!-- Frontend -->
  <g transform="translate(760, 280)">
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0f766e" text-anchor="middle">Frontend</text>
    
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#99f6e4"/>
      <text x="75" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#0f766e" text-anchor="middle">Developer Portal</text>
      <text x="75" y="28" font-family="Inter, sans-serif" font-size="8" fill="#14b8a6" text-anchor="middle">React • TypeScript</text>
    </g>
    <g transform="translate(15, 85)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#99f6e4"/>
      <text x="75" y="15" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#0f766e" text-anchor="middle">Admin Console</text>
      <text x="75" y="28" font-family="Inter, sans-serif" font-size="8" fill="#14b8a6" text-anchor="middle">React • Tailwind</text>
    </g>
  </g>

  <!-- Arrows -->
  <!-- Users to STOA -->
  <path d="M 230 160 L 275 160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- STOA to API Gateway -->
  <path d="M 480 170 L 525 170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- API Gateway to MCP Servers -->
  <path d="M 710 160 L 755 160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- STOA to Security -->
  <path d="M 330 260 L 180 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- STOA to Data -->
  <path d="M 330 260 L 180 460" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- STOA to Observability -->
  <path d="M 380 260 L 380 455" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Frontend to STOA -->
  <path d="M 760 345 L 480 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <g transform="translate(530, 460)">
    <rect x="0" y="0" width="410" height="170" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="205" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Technology Stack (Current Implementation)</text>
    
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#10b981"/>
      <text x="20" y="10" font-family="Inter, sans-serif" font-size="10" fill="#374151">Python + FastAPI (Control Plane, MCP Gateway)</text>
    </g>
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#06b6d4"/>
      <text x="20" y="10" font-family="Inter, sans-serif" font-size="10" fill="#374151">webMethods (API Gateway)</text>
    </g>
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#14b8a6"/>
      <text x="20" y="10" font-family="Inter, sans-serif" font-size="10" fill="#374151">React + TypeScript + Tailwind (UI)</text>
    </g>
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#f59e0b"/>
      <text x="20" y="10" font-family="Inter, sans-serif" font-size="10" fill="#374151">PostgreSQL + Redis + Kafka (Data)</text>
    </g>
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#f43f5e"/>
      <text x="20" y="10" font-family="Inter, sans-serif" font-size="10" fill="#374151">Keycloak + Vault (Security)</text>
    </g>
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#6366f1"/>
      <text x="20" y="10" font-family="Inter, sans-serif" font-size="10" fill="#374151">Prometheus + Grafana + Loki (Observability)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="780" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">© 2026 STOA Platform • gostoa.dev • Apache 2.0 License</text>
</svg>
