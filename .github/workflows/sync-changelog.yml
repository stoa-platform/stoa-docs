name: Sync Changelog from GitHub Releases

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]  # triggered from stoa repo after release-please

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate per-component releases section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update-changelog.sh
          ./scripts/update-changelog.sh

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs(changelog): sync per-component releases"
          title: "docs(changelog): sync per-component releases"
          body: |
            Automated sync of per-component releases from
            [stoa-platform/stoa releases](https://github.com/stoa-platform/stoa/releases).

            Regenerated by `.github/workflows/sync-changelog.yml`.
          branch: bot/changelog-sync
          delete-branch: true
