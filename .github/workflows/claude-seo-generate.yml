# CAB-1385 — AI Factory SEO Automation: Weekly Article Generation
# Generates a blog article from PLAN-SEO.md topic bank using Claude.
# Ask mode: creates PR for human review, never auto-merges.
# Kill-switch: set DISABLE_SEO_GENERATE=true in repo variables.

name: Claude SEO Generate

on:
  schedule:
    - cron: '0 7 * * 2'  # Tuesday 07:00 UTC
  workflow_dispatch: {}

concurrency:
  group: seo-generate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: vars.DISABLE_SEO_GENERATE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate article
        uses: anthropics/claude-code-action@beta
        with:
          prompt: |
            Read PLAN-SEO.md. Pick the highest-priority TODO topic.
            Read .claude/rules/seo-content.md for templates and rules.
            Read .claude/rules/content-compliance.md for disclaimer templates.
            Generate a blog article following all rules:
            - Front-matter: slug, title, description, authors, tags, keywords
            - Always add `unlisted: true` in frontmatter
            - Filename: blog/YYYY-MM-DD-<slug>.md with today's date
            - Minimum word count per content type (Tutorial>=1500, Comparison>=1200)
            - Include hub-spoke links (every spoke links to its hub)
            - Add disclaimer if comparing competitors
            - Add <!-- last verified: YYYY-MM --> on comparative claims
            Write the file to blog/ with correct date-slug filename.
          model: claude-haiku-4-5-20251001
          max_turns: 15
          allowed_tools: "Read,Glob,Grep,Write"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Validate build
        run: npm run build

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="seo/auto-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add blog/
          if git diff --cached --quiet; then
            echo "No article generated, skipping PR creation"
            exit 0
          fi
          git commit -m "docs(blog): auto-generate SEO article [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create --title "docs(blog): weekly SEO article" \
            --body "$(cat <<'EOF'
          ## Summary
          Auto-generated by AI Factory SEO pipeline (CAB-1385).

          ## Review checklist
          - [ ] Article quality and accuracy verified
          - [ ] Internal links resolve correctly
          - [ ] Disclaimer present (if comparative)
          - [ ] `unlisted: true` set (remove when ready to publish)

          **Requires human review before merge.**
          EOF
          )" \
            --label "seo-auto"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG=":memo: SEO Generate: article created — PR pending review"
          else
            MSG=":warning: SEO Generate: workflow $STATUS — check logs"
          fi
          curl -s -X POST "$SLACK_WEBHOOK" -H 'Content-Type: application/json' \
            -d "{\"text\":\"$MSG\"}"
