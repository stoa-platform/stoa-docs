name: Scheduled Publish

# Runs daily at 06:00 UTC to publish scheduled blog posts
# The prebuild script (manage-scheduled-posts.sh) handles:
#   - Adding unlisted: true to future-dated posts
#   - Removing unlisted: true from posts whose date has arrived
# Creates a PR and auto-merges it (branch protection blocks direct push to main).

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC (07:00 CET)
  workflow_dispatch: {}   # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scheduled posts manager
        run: bash scripts/manage-scheduled-posts.sh --apply

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet blog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No scheduled posts to publish today"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Posts to publish:"
            git diff --name-only blog/
          fi

      - name: Create PR and auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="chore/publish-scheduled-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add blog/
          git commit -m "chore(blog): publish scheduled posts for ${DATE}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(blog): publish scheduled posts for ${DATE}" \
            --body "Automated: removes \`unlisted: true\` from blog posts whose publish date has arrived." \
            --base main \
            --head "$BRANCH")

          echo "PR created: $PR_URL"
          gh pr merge "$PR_URL" --squash --auto --delete-branch
          echo "Auto-merge enabled"
