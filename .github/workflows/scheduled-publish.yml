name: Scheduled Publish

# Runs daily at 06:00 UTC to publish scheduled blog posts
# The prebuild script (manage-scheduled-posts.sh) handles:
#   - Adding unlisted: true to future-dated posts
#   - Removing unlisted: true from posts whose date has arrived
# Vercel auto-deploys on push to main, so we just need to commit the changes.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC (07:00 CET)
  workflow_dispatch: {}   # Manual trigger for testing

permissions:
  contents: write

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scheduled posts manager
        run: bash scripts/manage-scheduled-posts.sh --apply

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet blog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No scheduled posts to publish today"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Posts to publish:"
            git diff --name-only blog/
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          git commit -m "chore(blog): publish scheduled posts for $(date +%Y-%m-%d)"
          git push
